<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1640 820" width="1640" height="820">
  <defs>
    <style>
      .bg { fill: #f8fafc; }
      .box { rx: 8px; ry: 8px; stroke-width: 2px; }
      .box-prep { fill: #e0f2fe; stroke: #0284c7; }
      .box-train { fill: #fee2e2; stroke: #dc2626; }
      .box-extract { fill: #fef9c3; stroke: #ca8a04; }
      .box-eval { fill: #dcfce7; stroke: #16a34a; }
      
      .col-bg { fill: #ffffff; stroke: #e2e8f0; stroke-width: 2px; rx: 12px; }
      
      .title { font-family: 'Segoe UI', Arial, sans-serif; font-size: 20px; font-weight: bold; fill: #334155; text-anchor: middle; }
      .text-main { font-family: 'Segoe UI', Arial, sans-serif; font-size: 15px; font-weight: bold; fill: #0f172a; text-anchor: middle; }
      .text-sub { font-family: 'Segoe UI', Arial, sans-serif; font-size: 12px; fill: #475569; text-anchor: middle; }
      
      .arrow { fill: none; stroke: #94a3b8; stroke-width: 3px; }
      .arrow-dashed { fill: none; stroke: #94a3b8; stroke-width: 3px; stroke-dasharray: 6 6; }
      .arrow-red { fill: none; stroke: #ef4444; stroke-width: 3px; stroke-dasharray: 6 6; }
      .arrow-label { font-family: 'Segoe UI', Arial, sans-serif; font-size: 12px; font-weight: bold; fill: #475569; text-anchor: middle; }
    </style>
    <marker id="head" orient="auto" markerWidth="6" markerHeight="8" refX="5.5" refY="4">
      <path d="M0,0 V8 L6,4 Z" fill="#94a3b8" />
    </marker>
    <marker id="head-red" orient="auto" markerWidth="6" markerHeight="8" refX="5.5" refY="4">
      <path d="M0,0 V8 L6,4 Z" fill="#ef4444" />
    </marker>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#0f172a" flood-opacity="0.05" />
    </filter>
  </defs>

  <rect width="1640" height="820" class="bg" />

  <rect x="40" y="40" width="350" height="740" class="col-bg" filter="url(#shadow)" />
  <rect x="430" y="40" width="350" height="740" class="col-bg" filter="url(#shadow)" />
  <rect x="820" y="40" width="350" height="740" class="col-bg" filter="url(#shadow)" />
  <rect x="1210" y="40" width="350" height="740" class="col-bg" filter="url(#shadow)" />

  <text x="215" y="80" class="title">1. Data Prep (Scripts 01-02)</text>
  <text x="605" y="80" class="title">2. Training (Script 03)</text>
  <text x="1000" y="80" class="title">3. Mesh Extract (Script 05)</text>
  <text x="1385" y="80" class="title">4. Eval &amp; Store (Script 06)</text>

  <g filter="url(#shadow)">
    <rect x="75" y="120" width="280" height="70" class="box box-prep" />
    <text x="215" y="147" class="text-main">📦 Dataset (T&amp;T Truck)</text>
    <text x="215" y="167" class="text-sub">COLMAP Point Cloud &amp; Cameras</text>
  </g>
  <g filter="url(#shadow)">
    <rect x="75" y="240" width="280" height="70" class="box box-prep" />
    <text x="215" y="267" class="text-main">📏 Depth Anything V2</text>
    <text x="215" y="287" class="text-sub">Generates Monocular Depth Priors</text>
  </g>
  <g filter="url(#shadow)">
    <rect x="75" y="360" width="280" height="70" class="box box-prep" />
    <text x="215" y="387" class="text-main">⚙️ depth_params.json</text>
    <text x="215" y="407" class="text-sub">Scaling parameters</text>
  </g>
  <path d="M 215 190 L 215 240" class="arrow" marker-end="url(#head)" />
  <path d="M 215 310 L 215 360" class="arrow" marker-end="url(#head)" />

  <g filter="url(#shadow)">
    <rect x="465" y="120" width="280" height="70" class="box box-train" />
    <text x="605" y="147" class="text-main">🔺 TriangleModel Init</text>
    <text x="605" y="167" class="text-sub">Pool of independent 2D splats</text>
  </g>
  <g filter="url(#shadow)">
    <rect x="465" y="240" width="280" height="70" class="box box-train" />
    <text x="605" y="267" class="text-main">🖥️ CUDA Rasterization</text>
    <text x="605" y="287" class="text-sub">Differentiable rendering</text>
  </g>
  <g filter="url(#shadow)">
    <rect x="465" y="360" width="280" height="70" class="box box-train" />
    <text x="605" y="387" class="text-main">📉 Loss Computation</text>
    <text x="605" y="407" class="text-sub">L1, SSIM, Depth Reg</text>
  </g>
  <g filter="url(#shadow)">
    <rect x="465" y="480" width="280" height="70" class="box box-train" />
    <text x="605" y="507" class="text-main">🚀 SparseGaussianAdam</text>
    <text x="605" y="527" class="text-sub">Optimizes attributes (SH, size)</text>
  </g>
  <g filter="url(#shadow)">
    <rect x="465" y="600" width="280" height="70" class="box box-train" />
    <text x="605" y="627" class="text-main">🔄 Topology Updates</text>
    <text x="605" y="647" class="text-sub">Delaunay Triangulation used here!</text>
  </g>
  <g filter="url(#shadow)">
    <rect x="440" y="680" width="330" height="40" class="box box-train" />
    <text x="605" y="705" class="text-main">💡 Keeps splat triangles conditioned during training</text>
  </g>
  
  <path d="M 605 190 L 605 240" class="arrow" marker-end="url(#head)" />
  <path d="M 605 310 L 605 360" class="arrow" marker-end="url(#head)" />
  <path d="M 605 430 L 605 480" class="arrow" marker-end="url(#head)" />
  <path d="M 605 550 L 605 600" class="arrow" marker-end="url(#head)" />
  <path d="M 605 670 L 605 720 L 465 720 L 465 205" class="arrow-red" marker-end="url(#head-red)" />
  <rect x="435" y="710" width="200" height="20" fill="#ffffff" rx="4"/>
  <text x="535" y="724" class="arrow-label">Next Iteration (Backprop)</text>
  
  <path d="M 355 155 C 405 155, 415 155, 465 155" class="arrow" marker-end="url(#head)" />
  <rect x="360" y="145" width="100" height="20" fill="#ffffff" rx="4"/>
  <text x="410" y="159" class="arrow-label">Init</text>
  
  <path d="M 355 275 C 405 275, 415 395, 465 395" class="arrow" marker-end="url(#head)" />
  <rect x="360" y="325" width="100" height="20" fill="#ffffff" rx="4"/>
  <text x="410" y="339" class="arrow-label">Depth Prior</text>
  
  <g filter="url(#shadow)">
    <rect x="855" y="240" width="280" height="70" class="box box-extract" />
    <text x="995" y="267" class="text-main">📸 Unbounded Depth Render</text>
    <text x="995" y="287" class="text-sub">Render depth from trained splats</text>
  </g>
  <g filter="url(#shadow)">
    <rect x="855" y="360" width="280" height="70" class="box box-extract" />
    <text x="995" y="387" class="text-main">🧊 TSDF Volumetric Fusion</text>
    <text x="995" y="407" class="text-sub">Fuse depth into 3D voxel grid</text>
  </g>
  <g filter="url(#shadow)">
    <rect x="855" y="480" width="280" height="70" class="box box-extract" />
    <text x="995" y="507" class="text-main">⛏️ Marching Cubes</text>
    <text x="995" y="527" class="text-sub">Extracts solid, connected mesh</text>
  </g>
  <g filter="url(#shadow)">
    <rect x="855" y="600" width="280" height="70" class="box box-extract" />
    <text x="995" y="627" class="text-main">🕸️ fuse_unbounded.ply</text>
    <text x="995" y="647" class="text-sub">Final watertight surface mesh</text>
  </g>
  <g filter="url(#shadow)">
    <rect x="830" y="680" width="330" height="40" class="box box-extract" />
    <text x="995" y="705" class="text-main">💡 Essential to create standard mesh for AR/VR/Eval</text>
  </g>

  <path d="M 745 155 C 795 155, 805 275, 855 275" class="arrow" marker-end="url(#head)" />
  <rect x="700" y="205" width="200" height="20" fill="#ffffff" rx="4"/>
  <text x="800" y="219" class="arrow-label">Trained Splats (Triangle Soup)</text>
  
  <path d="M 995 310 L 995 360" class="arrow" marker-end="url(#head)" />
  <path d="M 995 430 L 995 480" class="arrow" marker-end="url(#head)" />
  <path d="M 995 550 L 995 600" class="arrow" marker-end="url(#head)" />

  <g filter="url(#shadow)">
    <rect x="1245" y="600" width="280" height="70" class="box box-eval" />
    <text x="1385" y="627" class="text-main">📏 Chamfer Distance Eval</text>
    <text x="1385" y="647" class="text-sub">Compare w/ GT Mesh</text>
  </g>
  <g filter="url(#shadow)">
    <rect x="1245" y="720" width="280" height="70" class="box box-eval" />
    <text x="1385" y="747" class="text-main">📊 MeshSplatting.json</text>
    <text x="1385" y="767" class="text-sub">Aggregate final results</text>
  </g>

  <path d="M 1135 635 C 1185 635, 1195 635, 1245 635" class="arrow" marker-end="url(#head)" />
  <rect x="1140" y="625" width="100" height="20" fill="#ffffff" rx="4"/>
  <text x="1190" y="639" class="arrow-label">Evaluate</text>
  
  <path d="M 1385 670 L 1385 720" class="arrow" marker-end="url(#head)" />
</svg>
